name: Build-ams

on:
  push:
    branches: [main-ams]
  pull_request:
    branches: [main-ams]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
