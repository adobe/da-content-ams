name = "da-content-ams"
main = "src/index.js"
compatibility_date = "2026-03-04"

# Note: account_id and keep_vars are set per environment below

# [secrets]
# Secrets must be set via: wrangler secret put SECRET_NAME --env ENVIRONMENT
# Required secrets per environment:
# - S3_ACCESS_KEY_ID (if accessing R2 directly)
# - S3_SECRET_ACCESS_KEY (if accessing R2 directly)
# Note: da-content-ams primarily accesses content via service binding to da-admin

[dev]
port = 8788

# === GOV STAGE ENVIRONMENT ===
########################################################
[env.gov-stage]
account_id = "980b8b7745c7f2165f369b9d6f3c61f5" # GovCloud Stage account
keep_vars = true
routes = [
  { pattern = "content-stg.ssa-da.live/*", zone_name = "ssa-da.live" }
]

services = [
  { binding = "daadmin", service = "da-admin-ams-gov-stage" }
]

[env.gov-stage.vars]
ENVIRONMENT = "gov-stage"
AEM_BUCKET_NAME = "aem-content-stage"
ADMIN_URL = "stg-admin.ssa-da.live"
ADMIN_EXCEPTED_ORGS = "adobe,ams-eds"
CF_ACCOUNT_ID = "980b8b7745c7f2165f369b9d6f3c61f5"

# Helix Admin IP whitelist (comma-separated) - https://www.aem.live/docs/security#backends-with-ip-filtering
# '3.227.118.73', // Adobe commercial AWS (us-east-1)
# '56.137.172.84', // Adobe GovCloud Stage - gov-aem (us-gov-west-1)
HELIX_ADMIN_IPS = "56.137.172.84"

# S3_ACCESS_KEY_ID = "set via wrangler secret put"
# S3_SECRET_ACCESS_KEY = "set via wrangler secret put"

# === GOV PROD ENVIRONMENT ===
########################################################
[env.gov-prod]
account_id = "980b8b7745c7f2165f369b9d6f3c61f5" # GovCloud Prod account - UPDATE WHEN AVAILABLE
keep_vars = true
routes = ["content.ssa-aem.live/*"]

services = [
  { binding = "daadmin", service = "da-admin-ams-gov-prod" }
]

[env.gov-prod.vars]
ENVIRONMENT = "gov-prod"
AEM_BUCKET_NAME = "aem-content-prod"
ADMIN_URL = "admin.ssa-da.live"
ADMIN_EXCEPTED_ORGS = "ams-eds"
CF_ACCOUNT_ID = "REPLACE_WITH_GOV_PROD_ACCOUNT_ID"

# Helix Admin IP whitelist (comma-separated) - https://www.aem.live/docs/security#backends-with-ip-filtering
# TBD_PROD_IP: Adobe GovCloud Prod - UPDATE WHEN AVAILABLE
HELIX_ADMIN_IPS = "TBD_PROD_IP"

# S3_ACCESS_KEY_ID = "set via wrangler secret put"
# S3_SECRET_ACCESS_KEY = "set via wrangler secret put"

# === ENT-AEM ENVIRONMENT ===
########################################################
[env.ent-aem]
account_id = "ff68e0f71563bc546fedcfda6bd8e5ca"
keep_vars = true
routes = [
  { pattern = "content.ent-da.live/*", zone_name = "ent-da.live" }
]

services = [
  { binding = "daadmin", service = "da-admin-ams-ent-aem" }
]

[env.ent-aem.vars]
ENVIRONMENT = "ent-aem"
AEM_BUCKET_NAME = "aem-content-ent"
ADMIN_URL = "admin.ent-da.live"
ADMIN_EXCEPTED_ORGS = "adobe,ams-eds,ssa-eds"
CF_ACCOUNT_ID = "ff68e0f71563bc546fedcfda6bd8e5ca"

# Helix Admin IP whitelist (comma-separated) - https://www.aem.live/docs/security#backends-with-ip-filtering
# 34.208.108.255, 52.26.227.164 // NAT Gateway IPs for ent-aem Lambda functions (us-west-2)
HELIX_ADMIN_IPS = "34.208.108.255, 52.26.227.164"

# S3_ACCESS_KEY_ID = "set via wrangler secret put"
# S3_SECRET_ACCESS_KEY = "set via wrangler secret put"
